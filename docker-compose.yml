version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: database_courses_online_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: database_courses_online
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - online_courses_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: database_courses_adminer
    ports:
      - "8080:8080"
    networks:
      - online_courses_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  online_courses_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
